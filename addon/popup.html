<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>p2r3 Converter</title>
  <style>
    *,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
    :root{--bg:#0f1117;--surface:#181b26;--surface2:#1e2233;--border:#272b3d;--accent:#5b7cf6;--accent-h:#7c97ff;--success:#3ecf8e;--error:#fc8181;--warning:#f6a623;--text:#e2e8f0;--muted:#64748b}
    html{min-width:450px;background:var(--bg)}
    body{width:450px;height:600px;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;font-size:13px;display:flex;flex-direction:column;overflow:hidden}
    #top-bar{background:var(--surface);border-bottom:1px solid var(--border);padding:9px 12px;display:flex;align-items:center;gap:8px;flex-shrink:0}
    .logo{font-size:18px;flex-shrink:0}
    #drop-zone{flex:1;min-width:0;border:2px dashed var(--border);border-radius:8px;padding:6px 10px;cursor:pointer;display:flex;align-items:center;gap:8px;transition:border-color .15s,background .15s}
    #drop-zone:hover,#drop-zone.drag-over{border-color:var(--accent);background:rgba(91,124,246,.07)}
    #drop-zone.has-file{border-color:var(--success);border-style:solid;background:rgba(62,207,142,.06)}
    .dz-icon{font-size:18px;flex-shrink:0}
    .dz-body{min-width:0;flex:1}
    .dz-hint{font-size:11px;color:var(--muted);white-space:nowrap}
    .dz-hint b{color:var(--accent)}
    #file-name{font-size:11px;font-weight:600;color:var(--success);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;display:none}
    #file-name.on{display:block}
    #btn-pick{flex-shrink:0;padding:6px 11px;background:var(--surface2);border:1px solid var(--border);border-radius:8px;color:var(--text);font-size:11px;cursor:pointer;white-space:nowrap;display:flex;align-items:center;gap:5px;transition:border-color .15s,background .15s}
    #btn-pick:hover{border-color:var(--accent);background:rgba(91,124,246,.08)}
    #btn-inject{flex-shrink:0;padding:7px 14px;background:var(--accent);border:none;border-radius:8px;color:#fff;font-size:12px;font-weight:700;cursor:pointer;white-space:nowrap;transition:background .15s,transform .1s,opacity .15s;letter-spacing:.2px}
    #btn-inject:hover:not(:disabled){background:var(--accent-h);transform:translateY(-1px)}
    #btn-inject:disabled{opacity:.38;cursor:not-allowed}
    #status-bar{height:24px;background:var(--surface2);border-bottom:1px solid var(--border);display:flex;align-items:center;padding:0 10px;gap:6px;flex-shrink:0}
    #s-dot{width:6px;height:6px;border-radius:50%;background:var(--muted);flex-shrink:0;transition:background .2s}
    #s-dot.loading{background:var(--warning);animation:blink 1.1s ease-in-out infinite}
    #s-dot.ok{background:var(--success)}
    #s-dot.error{background:var(--error)}
    #s-dot.injected{background:var(--success)}
    @keyframes blink{0%,100%{opacity:1;transform:scale(1)}50%{opacity:.35;transform:scale(.65)}}
    #s-msg{font-size:11px;color:var(--muted);flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
    #s-msg.ok{color:var(--success)}
    #s-msg.error{color:var(--error)}
    #s-msg.injected{color:var(--success)}
    #frame-wrap{flex:1;position:relative;overflow:hidden;background:#fff}
    #p2r3-frame{width:100%;height:100%;border:none;display:block;opacity:0;transition:opacity .3s}
    #p2r3-frame.ready{opacity:1}
    #overlay{position:absolute;inset:0;background:var(--bg);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;transition:opacity .3s}
    #overlay.gone{opacity:0;pointer-events:none}
    .spin{width:30px;height:30px;border:3px solid var(--border);border-top-color:var(--accent);border-radius:50%;animation:rot .75s linear infinite}
    @keyframes rot{to{transform:rotate(360deg)}}
    #overlay p{color:var(--muted);font-size:12px}
    #frame-err{position:absolute;inset:0;background:var(--bg);display:none;flex-direction:column;align-items:center;justify-content:center;gap:10px;text-align:center;padding:24px}
    #frame-err.on{display:flex}
    #frame-err .e-icon{font-size:32px}
    #frame-err h3{font-size:14px}
    #frame-err p{color:var(--muted);font-size:11px;max-width:320px;line-height:1.6}
    #btn-retry{padding:7px 18px;background:var(--accent);border:none;border-radius:8px;color:#fff;font-size:12px;font-weight:600;cursor:pointer}
    #btn-retry:hover{background:var(--accent-h)}
  </style>
</head>
<body>
  <div id="top-bar">
    <span class="logo">⚡</span>
    <div id="drop-zone" role="button" tabindex="0">
      <span class="dz-icon">📂</span>
      <div class="dz-body">
        <div class="dz-hint">Drop file here or <b>click to browse</b></div>
        <div id="file-name"></div>
      </div>
    </div>
    <button id="btn-pick">🗂 Pick file</button>
    <button id="btn-inject" disabled>✨ Inject</button>
  </div>
  <div id="status-bar">
    <div id="s-dot" class="loading"></div>
    <span id="s-msg">Loading p2r3 converter…</span>
  </div>
  <div id="frame-wrap">
    <iframe id="p2r3-frame" src="https://p2r3.github.io/convert/"
      sandbox="allow-scripts allow-same-origin allow-forms allow-downloads allow-popups allow-modals allow-pointer-lock">
    </iframe>
    <div id="overlay"><div class="spin"></div><p id="overlay-msg">Loading p2r3 converter…</p></div>
    <div id="frame-err">
      <span class="e-icon">⚠️</span>
      <h3>Failed to load</h3>
      <p id="err-detail">Could not embed the converter. Check your internet connection.</p>
      <button id="btn-retry">Retry</button>
    </div>
  </div>
  <script src="popup.js"></script>
</body>
</html>
